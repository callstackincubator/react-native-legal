name: Lint ObjC

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lint-objc.yml"
      - "packages/react-native-legal/ios/**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  lint-swift:
    name: Lint ObjC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Lint ObjC with clang-format
        uses: RafikFarhad/clang-format-github-action@601dce42932921470d1acf9295faa87752162048 # v7
        with:
          sources: "packages/react-native-legal/**/*.h,packages/react-native-legal/**/*.m,packages/react-native-legal/**/*.mm"
          style: file

