buildscript {
    def agp_version = rootProject.ext.has('androidGradlePluginVersion') ? rootProject.ext.get('androidGradlePluginVersion') : project.properties['ReactNativeLegal_androidGradlePluginVersion']
    def kotlin_version = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : project.properties['ReactNativeLegal_kotlinVersion']

    repositories {
        google()
        gradlePluginPortal()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:$agp_version")
        classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:$kotlin_version")
        classpath("com.diffplug.spotless:com.diffplug.spotless.gradle.plugin:8.10.2")
    }
}

if (project == rootProject) {
  apply from: 'spotless.gradle'
}

apply plugin: 'com.android.library'
// AGP 9 ships built-in Kotlin support and registers the `kotlin` extension
// itself. Applying the Kotlin plugin on top of it fails configuration with
// "Cannot add extension with name 'kotlin'". Only apply it when nothing has
// registered that extension yet.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}

if (project != rootProject) {
    apply plugin: "com.facebook.react"
}

apply plugin: "org.jetbrains.kotlin.plugin.compose"

def getOrExtDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['ReactNativeLegal_' + name]
}

def getOrExtIntegerDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['ReactNativeLegal_' + name]).toInteger()
}

android {
    compileSdkVersion getOrExtIntegerDefault('compileSdkVersion')

    namespace "com.reactnativelegal"

    defaultConfig {
        minSdkVersion getOrExtIntegerDefault('minSdkVersion')
        targetSdkVersion getOrExtIntegerDefault('targetSdkVersion')
    }

    buildFeatures {
        compose true
    }

    sourceSets {
        main {
            java.srcDirs += ['src/newarch/java', "${project.buildDir}/generated/source/codegen/java"]
        }
    }
}

repositories {
    maven {
        url "$projectDir/../node_modules/react-native/android"
    }
    mavenCentral()
    google()
}

dependencies {
    implementation "com.facebook.react:react-android" // Set by the React Native Gradle Plugin

    def aboutLibrariesVersion = getOrExtDefault('aboutLibrariesVersion')
    implementation("com.mikepenz:aboutlibraries-core:$aboutLibrariesVersion")
    implementation("com.mikepenz:aboutlibraries-compose-m3:$aboutLibrariesVersion")

    def composeBomVersion = getOrExtDefault('composeBomVersion')
    Dependency composeBom = platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation composeBom
    implementation("androidx.compose.foundation:foundation")
    implementation("androidx.compose.material:material")
    implementation("androidx.compose.material:material-icons-core")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.runtime:runtime")
    implementation("androidx.compose.ui:ui")
}
